name: fleettrack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: ft-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets:
      - postgres_superuser_password
      - app_db_password
      - keycloak_db_password
      - grafana_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGAPPNAME=healthcheck gosu postgres psql -d postgres -tAc
          "SELECT 1 FROM pg_database WHERE datname = 'fleettrack'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *default-logging

  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.2.0}
    container_name: ft-vault
    restart: unless-stopped
    command: ["server"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault_data:/vault/file
      - ./vault/config:/vault/config:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1; [ $$? -ne 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.0}
    container_name: ft-keycloak
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)";
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)";
        export FT_GRAFANA_CLIENT_SECRET="$$(cat /run/secrets/grafana_oidc_client_secret)";
        export FT_PW_ADMIN="$$(cat /run/secrets/kc_user_admin_password)";
        export FT_PW_COMMERCIAL1="$$(cat /run/secrets/kc_user_commercial1_password)";
        export FT_PW_ANALYST1="$$(cat /run/secrets/kc_user_analyst1_password)";
        export FT_PW_SUPPORT1="$$(cat /run/secrets/kc_user_support1_password)";
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak_app
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: "info,org.keycloak.events:debug"
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
      - grafana_oidc_client_secret
      - kc_user_admin_password
      - kc_user_commercial1_password
      - kc_user_analyst1_password
      - kc_user_support1_password
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    logging: *default-logging

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.4}
    container_name: ft-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_oidc_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:8080/realms/fleettrack/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/fleettrack/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/fleettrack/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'sales') && 'Editor' || contains(roles[*], 'analyst') && 'Viewer' || contains(roles[*], 'support') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: "http://localhost:8080/realms/fleettrack/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A3000%2Flogin"
    secrets:
      - grafana_admin_password
      - grafana_oidc_client_secret
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  api:
    build:
      context: ./app
    image: fleettrack-api:dev
    container_name: ft-api
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: dev
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: fleettrack
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID_FILE: /run/secrets/api_vault_role_id
      VAULT_SECRET_ID_FILE: /run/secrets/api_vault_secret_id
    secrets:
      - api_vault_role_id
      - api_vault_secret_id
    volumes:
      - ./app:/code
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - frontend
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  vault_data:
  grafana_data:

secrets:
  postgres_superuser_password:
    file: ./secrets/postgres_superuser_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
  keycloak_db_password:
    file: ./secrets/keycloak_db_password.txt
  grafana_db_password:
    file: ./secrets/grafana_db_password.txt
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  grafana_oidc_client_secret:
    file: ./secrets/grafana_oidc_client_secret.txt
  kc_user_admin_password:
    file: ./secrets/kc_user_admin_password.txt
  kc_user_commercial1_password:
    file: ./secrets/kc_user_commercial1_password.txt
  kc_user_analyst1_password:
    file: ./secrets/kc_user_analyst1_password.txt
  kc_user_support1_password:
    file: ./secrets/kc_user_support1_password.txt
  api_vault_role_id:
    file: ./secrets/api_vault_role_id.txt
  api_vault_secret_id:
    file: ./secrets/api_vault_secret_id.txt