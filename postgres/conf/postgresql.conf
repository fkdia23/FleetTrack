# ===== 1. EMPLACEMENT DES FICHIERS =====
data_directory = '/var/lib/postgresql/data'      # où PostgreSQL stocke les données (= le volume Docker)
hba_file = '/etc/postgresql/pg_hba.conf'         # notre fichier d'authentification (monté en :ro)
ident_file = '/var/lib/postgresql/data/pg_ident.conf'  # table de correspondance des identités (non utilisée ici)
 
# ===== 2. RÉSEAU ET CONNEXIONS =====
listen_addresses = '*'                           # écoute sur toutes les interfaces DU CONTENEUR ; le filtrage se fait par pg_hba + réseau Docker interne
port = 5432                                      # port standard
max_connections = 100                            # connexions simultanées maximum
superuser_reserved_connections = 3               # 3 places gardées pour un admin même si le serveur est saturé

# ===== 3. AUTHENTIFICATION =====
password_encryption = scram-sha-256              # les nouveaux mots de passe sont stockés en SCRAM (jamais md5)
ssl = off                                        # pas de TLS en dev (réseau interne isolé) ; activé en prod

# ===== 4. MÉMOIRE =====
shared_buffers = 256MB                           # cache de pages de PostgreSQL (~25 % de la RAM allouée)
work_mem = 8MB                                   # mémoire par opération de tri/jointure
maintenance_work_mem = 64MB                      # mémoire pour VACUUM, création d'index
effective_cache_size = 768MB                     # estimation du cache disque de l'OS (aide le planificateur)

# ===== 5. WAL (Write-Ahead Logging) =====
wal_level = replica                              # niveau de détail du journal ; passera à 'logical' en Partie 2 (CDC)
max_wal_size = 1GB                               # taille du WAL qui déclenche un checkpoint
min_wal_size = 80MB                              # WAL conservé pour recyclage
checkpoint_timeout = 5min                        # checkpoint au moins toutes les 5 min
fsync = on                                       # force l'écriture disque : ne JAMAIS désactiver
synchronous_commit = on                          # un COMMIT n'est confirmé qu'une fois le WAL sur disque

# ===== 6. GARDE-FOUS =====
idle_in_transaction_session_timeout = 60s        # tue une session qui laisse une transaction ouverte sans rien faire
statement_timeout = 30s                          # tue toute requête de plus de 30 s (protège contre les requêtes folles)
lock_timeout = 10s                               # abandonne l'attente d'un verrou après 10 s

# ===== 7. JOURNALISATION (alimente l'observabilité) =====
log_destination = 'stderr'                       # logs sur la sortie d'erreur => visibles avec docker logs
logging_collector = off                          # inutile : Docker collecte déjà stderr
log_line_prefix = '%m [%p] %u@%d app=%a '        # horodatage, PID, utilisateur@base, nom de l'application
log_connections = on                             # trace chaque connexion (audit)
log_disconnections = on                          # trace chaque déconnexion et sa durée
log_hostname = off                               # pas de résolution DNS inverse (plus rapide)
log_min_duration_statement = 500ms               # trace les requêtes plus lentes que 500 ms
log_statement = 'ddl'                            # trace CREATE/ALTER/DROP (utile pour auditer les migrations)
log_lock_waits = on                              # trace les attentes de verrou
log_checkpoints = on                             # trace les checkpoints
log_temp_files = 0                               # trace tout fichier temporaire (signe d'un work_mem trop petit)
log_timezone = 'UTC'                             # logs en UTC

# ===== 8. STATISTIQUES =====
shared_preload_libraries = 'pg_stat_statements'  # charge l'extension de stats par requête (redémarrage requis)
compute_query_id = on                            # identifiant unique par requête normalisée
pg_stat_statements.track = all                   # suit aussi les requêtes imbriquées

# ===== 9. LOCALISATION =====
timezone = 'UTC'                                 # fuseau des sessions
datestyle = 'iso, mdy'                           # format de date
default_text_search_config = 'pg_catalog.english'  # config de recherche plein texte par défaut